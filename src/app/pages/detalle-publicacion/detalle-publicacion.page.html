<ion-header>
  <ion-toolbar>

    <ion-buttons slot="start">
      <ion-back-button defaultHref="/calendario"></ion-back-button>
    </ion-buttons>

    <ion-title>Detalle de publicación</ion-title>

  </ion-toolbar>
</ion-header>


<ion-content class="ion-padding">

  <ion-list>

    <ion-item lines="none">
      <ion-label>
        <ion-text>
          <h1>Detalle de publicación</h1>
        </ion-text>

        <ion-note>
          Consulta el contenido programado y envía comentarios
          o solicita cambios.
        </ion-note>
      </ion-label>
    </ion-item>


    <ion-item>
      <ion-label>
        <h2>Omelette de vegetales</h2>
        <p>Guaymex</p>
        <ion-note>
          15/05/2025 09:00
        </ion-note>
      </ion-label>

      <ion-badge slot="end">
        Programada
      </ion-badge>
    </ion-item>


    <ion-item lines="none">
      <ion-label>
        <h2>Creativo</h2>
      </ion-label>
    </ion-item>


    <ion-card>

      <ion-card-content>

        <ion-text>
          Aquí irá el creativo
        </ion-text>

      </ion-card-content>

    </ion-card>


    <ion-item lines="none">
      <ion-label>
        <h2>Descripción / Copy</h2>
      </ion-label>
    </ion-item>


    <ion-item>
      <ion-textarea
        label="Comentario del cliente"
        labelPlacement="stacked"
        placeholder="Escribe tu comentario aquí..."
        maxlength="500"
        counter="true">
      </ion-textarea>
    </ion-item>


    <ion-button
      expand="block">
      Enviar comentario
    </ion-button>


    <ion-button
      expand="block"
      fill="outline">
      Solicitar cambio
    </ion-button>

  </ion-list>

</ion-content>
