<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio"></ion-back-button>
    </ion-buttons>

    <ion-title>Soporte</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-list>

    <ion-item>
      <ion-input
        label="Asunto"
        labelPlacement="stacked"
        placeholder="Escribe el asunto">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-textarea
        label="Mensaje"
        labelPlacement="stacked"
        placeholder="Escribe tu mensaje"
        maxlength="500"
        counter="true"
        autoGrow="true">
      </ion-textarea>
    </ion-item>

  </ion-list>

  <ion-card>
    <ion-card-content>

      <ion-item lines="none">
        <ion-icon name="mail-outline" slot="start"></ion-icon>

        <ion-label>
          <h2>Correo</h2>
          <p>soporte@marketingmanager.com</p>
        </ion-label>
      </ion-item>

      <ion-item lines="none">
        <ion-icon name="call-outline" slot="start"></ion-icon>

        <ion-label>
          <h2>Teléfono</h2>
          <p>81 1234 5678</p>
        </ion-label>
      </ion-item>

      <ion-item lines="none">
        <ion-icon name="time-outline" slot="start"></ion-icon>

        <ion-label>
          <h2>Horario</h2>
          <p>Lunes a viernes de 9:00 a 18:00</p>
        </ion-label>
      </ion-item>

    </ion-card-content>
  </ion-card>

  <ion-button expand="block">
    Enviar solicitud
  </ion-button>

</ion-content>
