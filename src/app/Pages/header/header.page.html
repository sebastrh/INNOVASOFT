
<ion-header>
  <ion-toolbar>

    <!-- Menú lateral -->
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <!-- Logo y nombre -->
    <ion-item lines="none" class="logo-item">

      <img
        src="../../../assets/icons/Logo_Marketing_Manager.svg"
        alt="Logo"
        class="logo-img">

      <ion-label>
        Marketing Manager
      </ion-label>

    </ion-item>

    
<ion-buttons slot="end">

  <!-- Carrito -->
  <ion-button
    class="btn-carrito"
    (click)="irCarrito()">

    <ion-icon
      name="cart-outline"
      slot="icon-only">
    </ion-icon>

    @if (cantidadCarrito() > 0) {
      <ion-badge class="badge-carrito">
        {{ cantidadCarrito() }}
      </ion-badge>
    }

  </ion-button>

  <!-- Perfil -->
   <!-- Botón de usuario -->
  <ion-button (click)="abrirPopover($event)">
    <ion-icon
      name="person-outline"
      slot="icon-only">
    </ion-icon>
  </ion-button>

</ion-buttons>


  </ion-toolbar>
</ion-header>

<!-- Popover de usuario -->
<ion-popover
  [isOpen]="popoverAbierto"
  [event]="eventoPopover"
  side="bottom"
  alignment="end"
  [dismissOnSelect]="true"
  (didDismiss)="popoverAbierto = false">

  <ng-template>
    <ion-content>
      <ion-list>

        <!-- Mi perfil -->
        <ion-item button class="perfil" (click)="perfil()" >
          <ion-icon
            name="person-outline"
            slot="start">
          </ion-icon>

          <ion-label>
            Mi perfil
          </ion-label>
        </ion-item>

        <!-- Cerrar sesión -->
         <!-- Botón de cerrar sesión -->
        <ion-item
          button
          class="cerrar-sesion"
          (click)="cerrarSesion()">

          <ion-icon
            name="log-out-outline"
            slot="start">
          </ion-icon>

          <ion-label>
            Cerrar sesión
          </ion-label>

        </ion-item>

      </ion-list>
    </ion-content>
  </ng-template>

</ion-popover>
